
name: Android Release Build

on:
  push:
    branches:
      - main
    tags:
      - '*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true

      - name: Restore Android keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Missing ANDROID_KEYSTORE_BASE64 secret"
            exit 1
          fi

          mkdir -p android/app/key

          printf '%s' "$KEYSTORE_BASE64" \
            | base64 --decode > android/app/key/release.keystore

          test -s android/app/key/release.keystore
          chmod 600 android/app/key/release.keystore

      - name: Create signing properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "$KEYSTORE_PASSWORD" ] || \
             [ -z "$KEY_ALIAS" ] || \
             [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Missing Android signing secrets"
            exit 1
          fi

          cat > android/app/key.properties <<EOF
          storeFile=key/release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

          chmod 600 android/app/key.properties

      - name: Get dependencies
        run: flutter pub get

      - name: Determine build version
        id: version
        run: |
          set -euo pipefail

          PUBSPEC_VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')

          BASE_VERSION="${PUBSPEC_VERSION%%+*}"
          BASE_CODE="${PUBSPEC_VERSION##*+}"

          if [[ "$BASE_CODE" == "$PUBSPEC_VERSION" ]]; then
            BASE_CODE=1
          fi

          BUILD_CODE=$((BASE_CODE + $(git rev-list --count HEAD)))

          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION_NAME="${GITHUB_REF_NAME#v}"
          else
            VERSION_NAME="$BASE_VERSION"
          fi

          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$BUILD_CODE" >> "$GITHUB_OUTPUT"

          echo "Building version: $VERSION_NAME"
          echo "Android version code: $BUILD_CODE"

      - name: Build release APK
        run: |
          flutter build apk --release \
            --build-name="${{ steps.version.outputs.version_name }}" \
            --build-number="${{ steps.version.outputs.version_code }}" \
            --dart-define=BUILD_VERSION=${{ steps.version.outputs.version_name }} \
            --dart-define=BUILD_CODE=${{ steps.version.outputs.version_code }} \
            --dart-define=BUILD_TYPE=release \
            --dart-define=BUILD_SOURCE=${{ github.ref_type }}

      - name: Verify APK
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -s "$APK" ]; then
            echo "::error::APK was not generated"
            exit 1
          fi

          ls -lh "$APK"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false

      - name: Upload main branch APK
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: app-release-main
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
