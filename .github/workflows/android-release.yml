name: Android Release Build

on:
  push:
    branches:
      - main
    tags:
      - '*'

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: 'stable'
          cache: true

      - name: Decode and restore keystore
        run: |
          mkdir -p ${{ github.workspace }}/android/app/key
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > ${{ github.workspace }}/android/app/key/release.keystore
          chmod 600 ${{ github.workspace }}/android/app/key/release.keystore

      - name: Get app version from pubspec.yaml
        id: version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | head -n 1 | awk '{print $2}' | tr -d 'v')
          # Split version: 1.0.4+5 -> versionName=1.0.4, versionCode=5
          VERSION_NAME=$(echo "$VERSION" | cut -d'+' -f1)
          VERSION_CODE=$(echo "$VERSION" | cut -d'+' -f2)
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "Full version: $VERSION"

      - name: Determine build version
        id: build_version
        run: |
          if [[ -n "$GITHUB_REF_TYPE" && "$GITHUB_REF_TYPE" == "tag" ]]; then
            TAG_VERSION=$(echo "$GITHUB_REF_NAME" | sed 's/^v//')
            echo "version_name=$TAG_VERSION" >> $GITHUB_OUTPUT
            # Extract version code from tag (e.g., v1.2.3 -> 123, or use git tag count)
            VERSION_CODE=$(git tag --sort=version:refname | grep -n "$TAG_VERSION" | head -1 | cut -d: -f1)
            echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
            echo "Building from tag: $GITHUB_REF_NAME -> $TAG_VERSION (code: $VERSION_CODE)"
          else
            echo "version_name=${{ steps.version.outputs.VERSION_NAME }}" >> $GITHUB_OUTPUT
            echo "version_code=$(( ${{ steps.version.outputs.VERSION_CODE }} + $(git rev-list --count HEAD) ))" >> $GITHUB_OUTPUT
            echo "Building from main branch"
          fi

      - name: Build release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/android/app/key/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter pub get
          flutter build apk --release \
            --dart-define=BUILD_VERSION=${{ steps.build_version.outputs.version_name }} \
            --dart-define=BUILD_CODE=${{ steps.build_version.outputs.version_code }} \
            --dart-define=BUILD_TYPE=release \
            --dart-define=BUILD_SOURCE=${{ github.ref_type }}
          echo "APK built successfully"
          ls -la build/app/outputs/flutter-apk/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false

      - name: Upload APK as artifact for main branch push
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: app-release-main
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
